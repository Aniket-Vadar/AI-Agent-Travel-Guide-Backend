# Covers backend/ and scripts/ from the repository root.
line-length = 100
exclude = [".venv", "backend/data"]
# `app` is the backend package; tell isort where its root is so imports of it are
# grouped as first-party even when ruff runs from the repository root.
src = ["backend"]
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # long lines are handled by the formatter, not the linter
    "B008",    # FastAPI's Depends() in defaults is the documented pattern
    "RUF001",  # prose in docstrings legitimately uses typographic characters
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
"backend/tests/*" = ["N802", "N803", "SIM117"]
"scripts/*" = ["T201"]  # these are CLI tools; printing is the point

[lint.isort]
known-first-party = ["app"]
